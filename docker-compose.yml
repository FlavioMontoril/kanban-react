services:
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: react-kanbam
    # Lê automaticamente todas as variáveis do arquivo .env
    environment:
      - .env.development
    restart: unless-stopped
    ports:
      - "5173:5173"
    networks:
      - auth-server-network
      - kanban-server-network

networks:
  auth-server-network:
    name: auth-server-network
    external: true # Reutiliza a rede criada pelo docker-compose da API
  kanban-server-network:
    external: true  # Reutiliza a rede da API de Tarefas
    name: kanban-server-network