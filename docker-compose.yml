services:
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
      - VITE_API_AUTH_BASE_URL=${VITE_API_AUTH_BASE_URL}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_WS_URL=${VITE_WS_URL}
      - VITE_AUTH_WS_URL=${VITE_AUTH_WS_URL}
    container_name: react-kanbam
    restart: unless-stopped
    ports:
      - "5173:8080"
    networks:
      - auth-server-network
      - kanban-server-network

networks:
  auth-server-network:
    name: auth-server-network
    external: true # Reutiliza a rede criada pelo docker-compose da API
  kanban-server-network:
    external: true  # Reutiliza a rede da API de Tarefas
    name: kanban-server-network