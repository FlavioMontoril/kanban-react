server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Garante que rotas do React Router funcionem redirecionando para o index.html
        try_files $uri $uri/ /index.html;
    }

    # Opcional: Tratamento para erros de servidor
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}