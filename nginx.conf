server {
    listen 8080;
    server_name localhost;

    # Oculta a versão do Nginx nos cabeçalhos de resposta
    server_tokens off;

    # Limite máximo para upload no body (avatars/arquivos)
    client_max_body_size 10M;

    # Cabeçalhos de Segurança HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-ancestors 'self';" always;

    # Compressão Gzip para otimização de banda
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # ------------------------------------------------------------------
    # 1. API DE AUTENTICAÇÃO (auth-server-api)
    # ------------------------------------------------------------------

    # Redireciona chamadas da API de Autenticação
    location /api/ {
        proxy_pass http://auth-server-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserva e repassa os cabeçalhos de cookie
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
    }

    # Proxy para WebSocket da API de Autenticação
    location /ws {
        proxy_pass http://auth-server-api:8080/ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass_header Set-Cookie;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Encaminha mídias/avatars servidos pela API de Tarefas
    location /uploads/ {
        proxy_pass http://auth-server-api:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # # Redireciona conexões WebSockets, se utilizado (Porta 8081 ou Gateway)
    # location /ws/ {
    #     proxy_pass http://auth-server-api:8080/ws/;

    #     # Suporte completo a WebSockets Upgrade
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "Upgrade";

    #     # Repassa cabeçalhos de identificação
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;

    #     # Configurações para conexões longas (evita timeout de SockJS/EventSource)
    #     proxy_read_timeout 3600s;
    #     proxy_send_timeout 3600s;
    #     proxy_buffering off;
    # }

    # ------------------------------------------------------------------
    # 2. API DE TAREFAS / KANBAN (aprendizado_api)
    # ------------------------------------------------------------------

    # Encaminha chamadas /v1/... para a API de Tarefas
    location /api-kanban/ {
        proxy_pass http://aprendizado_api:8080/api-kanban/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Repassa o cookie HttpOnly (auth_token) para validação de rotas
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
    }

    # Proxy para WebSocket da API de Tarefas (ex: /ws-tasks ou /ws)
    location /ws-kanban {
        proxy_pass http://aprendizado_api:8080/ws-kanban;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass_header Set-Cookie;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ------------------------------------------------------------------
    # ARQUIVOS ESTÁTICOS E ROTEAMENTO SPA (React)
    # ------------------------------------------------------------------

    # Cache agressivo e imutável para assets estáticos gerados pelo Vite com hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Evita cache do index.html para garantir atualizações imediatas em novos deploys
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-ancestors 'self';" always;
    }

    # Roteamento SPA: Garante que rotas do React Router funcionem redirecionando para o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tratamento para erros de servidor
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}